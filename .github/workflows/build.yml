name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  UPSTREAM_MONO_BRANCH_REF: 6c5d5c4c792e4357505e47966fa5489d4fa45cff

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version_prefix: ${{ steps.variables.outputs.version_prefix }}
    steps:
      - name: Checkout Mono.Posix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mono/mono.posix
          ref: ${{ env.UPSTREAM_MONO_BRANCH_REF }}
          path: build
          submodules: true

      - name: Install xmllint
        run: |
          sudo apt update
          sudo apt install -y libxml2-utils

      - name: Setup variables
        id: variables
        shell: bash
        run: |
          VERSION_PREFIX=$(xmllint --xpath '/*[local-name()="Project"]/*[local-name()="PropertyGroup"]/*[local-name()="VersionPrefix"]/text()' build/eng/Versions.props)

          echo "version_prefix=${VERSION_PREFIX}" >> "$GITHUB_OUTPUT"

  build_linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Mono.Posix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mono/mono.posix
          ref: ${{ env.UPSTREAM_MONO_BRANCH_REF }}
          path: build
          submodules: true

      - name: Apply patches
        working-directory: build
        run: |
          git apply --stat --apply ../patches/arm-32bit-large-file-support.patch

      - name: Build
        uses: docker://mirror.gcr.io/debian:trixie
        with:
          args: /bin/sh -c "apt-get update && apt-get upgrade --yes && apt-get --yes install build-essential cmake ninja-build g++-arm-linux-gnueabihf g++-aarch64-linux-gnu && CC=gcc-14 CXX=g++-14 ./build/build.sh --no-color --verbose --managed-verbosity detailed --configuration Release host"

      - name: List artifacts
        run: |
          ls -lhR build/artifacts/*-release/lib/*
          file build/artifacts/*-release/lib/*.so
          ldd build/artifacts/*-release/lib/*.so || true

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-linux
          path: build/artifacts/*-release/lib/*
          if-no-files-found: error

  build_linux_musl:
    runs-on: ${{ startsWith(matrix.architecture, 'arm') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm64
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Mono.Posix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mono/mono.posix
          ref: ${{ env.UPSTREAM_MONO_BRANCH_REF }}
          path: build
          submodules: true

      - name: Apply patches
        working-directory: build
        run: |
          git apply --stat --apply ../patches/arm-32bit-large-file-support.patch
          git apply --stat --apply ../patches/build_single_arch.patch

      - name: Build
        uses: docker://mirror.gcr.io/alpine:3.24
        with:
          args: /bin/sh -c "apk add -U --no-cache bash alpine-sdk cmake make samurai && ./build/build.sh --no-color --verbose --managed-verbosity detailed --configuration Release host"

      - name: Prepare build artifact
        run: sudo mv build/artifacts/host-linux-x64-release build/artifacts/host-linux-musl-${{ matrix.architecture }}-release

      - name: List artifacts
        run: |
          ls -lhR build/artifacts/*-release/lib/*
          file build/artifacts/*-release/lib/*.so
          ldd build/artifacts/*-release/lib/*.so || true

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-linux-musl-${{ matrix.architecture }}
          path: build/artifacts/*-release/lib/*
          if-no-files-found: error

  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Mono.Posix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mono/mono.posix
          ref: ${{ env.UPSTREAM_MONO_BRANCH_REF }}
          path: build
          submodules: true

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r27d
          add-to-path: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get --show-upgraded --yes install ninja-build

      - name: Build
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./build/build.sh --no-color --verbose --managed-verbosity detailed --configuration Release android

      - name: List artifacts
        run: |
          ls -lhR build/artifacts/*-release/lib/*
          file build/artifacts/*-release/lib/*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-android
          path: build/artifacts/*-release/lib/*
          if-no-files-found: error

  build_freebsd:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm64
          - x64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Mono.Posix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mono/mono.posix
          ref: ${{ env.UPSTREAM_MONO_BRANCH_REF }}
          path: build
          submodules: true

      - name: Apply patches
        working-directory: build
        run: |
          git apply --stat --apply ../patches/build_single_arch.patch

      - name: Build in FreeBSD
        uses: vmactions/freebsd-vm@77ed28d336d03fe19a3f4f7266c1d2c4714dd79d # v1.5.2
        with:
          release: 14.4
          usesh: true
          arch: ${{ matrix.architecture == 'arm64' && 'aarch64' || 'x86_64' }}
          prepare: |
            pkg install -y ninja bash cmake gcc
          run: |
            bash ./build/build.sh --no-color --verbose --managed-verbosity detailed --configuration Release host
            strip --strip-all build/artifacts/*-release/lib/*.so

      - name: Prepare build artifact
        run: |
          sudo mv build/artifacts/host-freebsd-x64-release build/artifacts/host-freebsd-${{ matrix.architecture }}-release || true

      - name: List artifacts
        run: |
          ls -lhR build/artifacts/*-release/lib/*
          file build/artifacts/*-release/lib/*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-freebsd-${{ matrix.architecture }}
          path: build/artifacts/*-release/lib/*
          if-no-files-found: error

  build_mac:
    runs-on: macos-latest
    steps:
      - name: Checkout Mono.Posix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mono/mono.posix
          ref: ${{ env.UPSTREAM_MONO_BRANCH_REF }}
          path: build
          submodules: true

      - name: Build
        shell: bash
        run: |
          ./build/build.sh --no-color --verbose --managed-verbosity detailed --configuration Release host

      - name: List artifacts
        run: |
          ls -lhR build/artifacts/*-release/lib/*
          file build/artifacts/*-release/lib/*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-mac
          path: build/artifacts/*-release/lib/*
          if-no-files-found: error

  build_mac_catalyst:
    runs-on: macos-latest
    steps:
      - name: Checkout Mono.Posix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mono/mono.posix
          ref: ${{ env.UPSTREAM_MONO_BRANCH_REF }}
          path: build
          submodules: true

      - name: Build
        shell: bash
        run: |
          ./build/build.sh --no-color --verbose --managed-verbosity detailed --configuration Release catalyst

      - name: List artifacts
        run: |
          ls -lhR build/artifacts/*-release/lib/*
          file build/artifacts/*-release/lib/*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-mac-catalyst
          path: build/artifacts/*-release/lib/*
          if-no-files-found: error

  build_ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Mono.Posix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mono/mono.posix
          ref: ${{ env.UPSTREAM_MONO_BRANCH_REF }}
          path: build
          submodules: true

      - name: Build
        shell: bash
        run: |
          ./build/build.sh --no-color --verbose --managed-verbosity detailed --configuration Release ios

      - name: List artifacts
        run: |
          ls -lhR build/artifacts/*-release/lib/*
          file build/artifacts/*-release/lib/*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-ios
          path: build/artifacts/*-release/lib/*
          if-no-files-found: error

  build_tvos:
    runs-on: macos-latest
    steps:
      - name: Checkout Mono.Posix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mono/mono.posix
          ref: ${{ env.UPSTREAM_MONO_BRANCH_REF }}
          path: build
          submodules: true

      - name: Build
        shell: bash
        run: |
          ./build/build.sh --no-color --verbose --managed-verbosity detailed --configuration Release tvos

      - name: List artifacts
        run: |
          ls -lhR build/artifacts/*-release/lib/*
          file build/artifacts/*-release/lib/*

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-tvos
          path: build/artifacts/*-release/lib/*
          if-no-files-found: error

  test:
    needs:
      - build_linux
      - build_linux_musl
      - build_android
      - build_freebsd
      - build_mac
      - build_mac_catalyst
      - build_ios
      - build_tvos
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Mono.Posix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mono/mono.posix
          ref: ${{ env.UPSTREAM_MONO_BRANCH_REF }}
          path: build
          submodules: true

      - name: Apply patches
        working-directory: build
        run: |
          git apply --stat --apply ../patches/freebsd.patch
          git apply --stat --apply ../patches/linux_musl.patch
          git apply --stat --apply ../patches/renamed_package.patch

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: build/artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR build/artifacts

      - name: Build managed
        shell: bash
        run: |
          ./build/build.sh --no-color --verbose --managed-verbosity normal --configuration Release managed

      - name: Test
        shell: bash
        run: |
          ./build/build.sh --no-color --verbose --managed-verbosity diag --configuration Release --no-build test

  package:
    needs:
      - prepare
      - build_linux
      - build_linux_musl
      - build_android
      - build_freebsd
      - build_mac
      - build_mac_catalyst
      - build_ios
      - build_tvos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Mono.Posix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mono/mono.posix
          ref: ${{ env.UPSTREAM_MONO_BRANCH_REF }}
          path: build
          submodules: true

      - name: Apply patches
        working-directory: build
        run: |
          git apply --stat --apply ../patches/freebsd.patch
          git apply --stat --apply ../patches/linux_musl.patch
          git apply --stat --apply ../patches/renamed_package.patch

      - name: Setup variables
        id: variables
        run: |
          echo "build_id=$(date +%Y%m%d).1" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          path: build/artifacts
          merge-multiple: true

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts
          path: build/artifacts
          if-no-files-found: error

      - name: List artifacts
        run: ls -lhR build/artifacts

      - name: Package
        shell: bash
        run: >-
          ./build/eng/common/build.sh
          --restore
          --build
          --pack
          --publish
          --ci
          --configuration Release
          --verbosity detailed
          --projects ${{ github.workspace }}/build/Mono.Unix.sln
          -p:PackageAllNativeLibs=true
          -p:Version=${{ needs.prepare.outputs.version_prefix }}.${{ github.run_number }}
          -p:OfficialBuildId=${{ steps.variables.outputs.build_id }}

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages
          path: build/artifacts/packages/Release/Shipping/*.nupkg
          if-no-files-found: error

  release:
    needs:
      - prepare
      - test
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    steps:
      - name: Download packages artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages

      - name: Create release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: packages/*.nupkg
          artifactErrorsFailBuild: true
          draft: false
          generateReleaseNotes: false
          skipIfReleaseExists: true
          immutableCreate: true
          name: v${{ needs.prepare.outputs.version_prefix }} (build ${{ github.run_number }})
          tag: v${{ needs.prepare.outputs.version_prefix }}.${{ github.run_number }}

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    steps:
      - name: Download packages artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages

      - name: Push to GitHub
        shell: bash
        run: >-
          dotnet nuget push
          packages/Openur.Mono.Unix.*.nupkg
          --no-symbols
          --skip-duplicate
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}

      - name: NuGet login
        uses: nuget/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: Openur

      - name: Push to NuGet
        shell: bash
        run: >-
          dotnet nuget push
          packages/Openur.Mono.Unix.*.nupkg
          --skip-duplicate
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
